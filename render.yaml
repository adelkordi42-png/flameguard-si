# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo, then New > Blueprint and point it at the repository.
services:
  - type: web
    name: flameguard-si
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: JEV_MODE
        value: "cache"
      - key: ENGINE_PROVIDER
        value: "physics"
      - key: JEV_API_KEY
        sync: false